# 回复模板库（配置化：中通改口径/客服改话术只改这个文件，不改代码）
# 键=问题件类型（或一级类型）；uncategorized=未配置类型的兜底
# 语料来源：客服真实回复套路（实测「最新回复内容」列）

uncategorized:
  - "已收到，正在处理，谢谢"

催派件:
  - "已在派件（网点版系统回复）"
  - "时效内派送（网点版系统回复）"
  - "次日时效，明日带到镇上（网点版系统回复）"

客户联系不上:
  - "已联系客户，安排派送（网点版系统回复）"

客户要求暂放:
  - "已按客户要求暂放（网点版系统回复）"

客户要求更改派送日期:
  - "已与客户约定派送日期（网点版系统回复）"

周末节假日无人收货:
  - "已知晓，节后安排派送（网点版系统回复）"

客户要求自提:
  - "已按客户要求留站自提（网点版系统回复）"

客户要求改地址:
  - "已按客户要求修改地址（网点版系统回复）"

客户要求清点、码放、拆托:
  - "已安排清点码放（网点版系统回复）"

客户要求上楼,与开单不符:
  - "已与客户沟通确认（网点版系统回复）"

运单信息修改:
  - "知悉（网点版系统回复）"

通知类:
  - "已收到通知，正在处理，谢谢（网点版系统回复）"

有单无货:
  - "已核实，待货物到达后安排派送（网点版系统回复）"

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>问题件助手</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --line:#e8eaed; --text:#1f2329; --sub:#86909c;
          --blue:#3370ff; --green:#00b42a; --orange:#ff7d00; --red:#f53f3f; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:"Segoe UI","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:16px 28px;
           display:flex; align-items:center; }
  header h1 { font-size:20px; font-weight:600; }
  .auto-box { margin-left:auto; display:flex; align-items:center; gap:10px; }
  .switch { position:relative; width:52px; height:28px; background:#c9cdd4; border-radius:14px;
            cursor:pointer; transition:.2s; }
  .switch.on { background:var(--green); }
  .switch::after { content:""; position:absolute; top:3px; left:3px; width:22px; height:22px;
                   background:#fff; border-radius:50%; transition:.2s; }
  .switch.on::after { left:27px; }
  .switch-label { font-size:15px; }
  main { max-width:760px; margin:24px auto; padding:0 20px; }
  /* 只留一个大数字：还有几件没回 */
  .big-stat { background:var(--card); border:1px solid var(--line); border-radius:16px;
              padding:32px; text-align:center; margin-bottom:20px; }
  .big-stat .num { font-size:56px; font-weight:700; }
  .big-stat .num.zero { color:var(--green); }
  .big-stat .num.nonzero { color:var(--orange); }
  .big-stat .label { font-size:15px; color:var(--sub); margin-top:6px; }
  .list-title { font-size:16px; font-weight:600; margin:20px 0 10px; display:flex; align-items:center; }
  .refresh-btn { margin-left:auto; font-size:13px; color:var(--blue); cursor:pointer;
                 background:none; border:none; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .item { padding:16px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:14px; }
  .item:last-child { border-bottom:none; }
  .item .main { flex:1; min-width:0; }
  .item .type { font-size:15px; font-weight:600; }
  .item .desc { font-size:13px; color:var(--sub); margin-top:4px; overflow:hidden;
                text-overflow:ellipsis; white-space:nowrap; }
  .item .who { font-size:12px; color:var(--sub); margin-top:4px; }
  .badge { font-size:12px; padding:4px 12px; border-radius:12px; white-space:nowrap; }
  .badge.red { background:#ffece8; color:var(--red); }
  .badge.green { background:#e8ffea; color:var(--green); }
  .badge.orange { background:#fff7e8; color:var(--orange); }
  .empty { padding:56px 20px; text-align:center; color:var(--sub); }
  .empty .icon { font-size:44px; margin-bottom:10px; }
  .empty .tip { font-size:14px; }
  #toast { position:fixed; bottom:28px; left:50%; transform:translateX(-50%); background:#1f2329;
           color:#fff; padding:12px 24px; border-radius:10px; font-size:14px; opacity:0; transition:.3s; }
  #toast.show { opacity:1; }
  .ai-check { margin-top:20px; display:none; }
  .ai-check.show { display:block; }
  .ai-check .box { background:#fff7e8; border:1px solid #ffe4a0; border-radius:12px; padding:14px 18px;
                   font-size:13px; color:#8f4a00; line-height:1.8; }
</style>
</head>
<body>
<header>
  <h1>问题件助手</h1>
  <div class="auto-box">
    <span class="switch-label">自动回复</span>
    <div class="switch" id="autoSwitch" onclick="toggleAuto()"></div>
  </div>
</header>
<main>
  <div class="big-stat">
    <div class="num" id="bigNum">–</div>
    <div class="label" id="bigLabel">还没回的问题件</div>
  </div>

  <div class="ai-check" id="aiCheck">
    <div class="box" id="aiBox"></div>
  </div>

  <div class="list-title">问题件 <button class="refresh-btn" onclick="loadList(true)">刷新</button></div>
  <div id="breakerNote" style="font-size:12px;color:#f53f3f;margin:-4px 0 10px;display:none"></div>
  <div class="card" id="list"><div class="empty">加载中…</div></div>
</main>

<div id="toast"></div>
<script>
const API = location.origin;

// 访问码：首次输入一次，存 localStorage，之后自动带（X-Read-Token / X-Bridge-Token 均可）
function getToken() { return localStorage.getItem('accessCode') || ''; }

function authHeaders() {
  const t = getToken();
  return t ? { 'X-Read-Token': t, 'X-Bridge-Token': t } : {};
}

// 统一带鉴权的 fetch：401 时清码重新输（不再刷一堆 console 错）
async function authedFetch(url, opts = {}) {
  const r = await fetch(url, { ...opts, headers: { ...authHeaders(), ...(opts.headers || {}) } });
  if (r.status === 401) {
    localStorage.removeItem('accessCode');
    if (requireCode()) throw new Error('need access code');
    // 重试一次
    return fetch(url, { ...opts, headers: { ...authHeaders(), ...(opts.headers || {}) } });
  }
  return r;
}

function requireCode() {
  if (getToken()) return false;
  const code = prompt('首次使用：请输入访问码（管理员提供的密钥）');
  if (code && code.trim()) {
    localStorage.setItem('accessCode', code.trim());
    return false; // 已存，继续
  }
  document.body.innerHTML = '<div style="padding:60px;text-align:center;color:#86909c;font-size:15px">需要访问码才能使用。请刷新页面重新输入。</div>';
  return true;
}

function esc(s) { return (s||'').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

async function refreshAuto() {
  try {
    const s = await (await authedFetch(API + '/auto-reply/status')).json();
    document.getElementById('autoSwitch').classList.toggle('on', s.enabled);
  } catch (e) {
    // 只读页（8766）没有开关端点——隐藏开关（开关在装机终端的 8765 页面）
    document.querySelector('.auto-box').style.display = 'none';
  }
}

async function toggleAuto() {
  const s = await (await authedFetch(API + '/auto-reply/status')).json();
  const next = !s.enabled;
  if (next && !confirm('开启后，系统会帮您把回复写好。\n最后一步（点发送）还是您来确认。\n\n要开启吗？')) return;
  const r = await (await authedFetch(API + '/auto-reply/toggle', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({enabled: next})
  })).json();
  if (r.ok) { toast(next ? '已开启' : '已关闭'); refreshAuto(); }
}

async function loadList(force) {
  const box = document.getElementById('list');
  box.innerHTML = '<div class="empty">加载中…</div>';
  try {
    const data = await (await authedFetch(API + '/problem-parcels' + (force ? '?force=true' : ''))).json();
    const items = data.items || [];
    const wait = items.filter(i => !i.latest_reply).length;
    // 大数字：还有几件没回
    const num = document.getElementById('bigNum');
    num.textContent = wait;
    num.className = 'num ' + (wait === 0 ? 'zero' : 'nonzero');

    if (!items.length) {
      box.innerHTML = '<div class="empty"><div class="icon">✓</div><div class="tip">没有需要处理的问题件</div></div>';
      return;
    }
    // 未回复排前面；每个只显示三行字：类型、一句话、网点
    const sorted = [...items].sort((a,b) => (a.latest_reply?1:0) - (b.latest_reply?1:0));
    box.innerHTML = sorted.slice(0, 20).map(it => {
      let badge;
      if (it.latest_reply) badge = '<span class="badge green">已回复</span>';
      else if (it.needs_human) badge = '<span class="badge red">要您亲自处理</span>';
      else badge = '<span class="badge orange">没回</span>';
      return `<div class="item">
        <div class="main">
          <div class="type">${esc(it.ptype)}</div>
          <div class="desc">${esc((it.description||'').slice(0,50))}</div>
          <div class="who">${esc(it.outlet_from)} → ${esc(it.outlet_notify)}</div>
        </div>
        ${badge}
      </div>`;
    }).join('');
  } catch (e) {
    box.innerHTML = `<div class="empty">加载失败：${esc(e.message)}<br>若提示需要访问码，请刷新页面重新输入</div>`;
  }
}

async function loadBreaker() {
  try {
    const b = await (await authedFetch(API + '/breaker/status')).json();
    if (b.tripped) {
      const el = document.getElementById('breakerNote');
      el.style.display = 'block';
      el.textContent = '系统检测到异常已自动暂停自动回复，管理员已收到通知。';
    }
  } catch (e) { /* 静默 */ }
}

async function loadRetrospect() {
  try {
    const r = await (await authedFetch(API + '/retrospect/latest')).json();
    const flagged = (r.flagged || []).length;
    if (flagged > 0) {
      const box = document.getElementById('aiCheck');
      box.classList.add('show');
      document.getElementById('aiBox').innerHTML =
        `<b>系统自查发现 ${flagged} 条回复建议复查</b>（详情已通知管理员），请留意近期的回复。`;
    }
  } catch (e) { /* 静默 */ }
}

setInterval(() => loadList(false), 300000);
if (!requireCode()) {
  refreshAuto();
  loadList(false);
  loadRetrospect();
  loadBreaker();
}
</script>
</body>
</html>
